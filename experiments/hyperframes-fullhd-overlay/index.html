<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1080,initial-scale=1"/>
<title>Original synthetic transparent lower-third overlay 1080x1920</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important}
#alpha-stage{position:relative;width:1080px;height:1920px;background:transparent;overflow:hidden}
.lower-third{position:absolute;left:126px;top:1365px;width:828px;height:276px;border-radius:51px;background:#23505b;border:6px solid #8dd4bf;
 box-shadow:none;animation:appear 1s linear both}
.accent{position:absolute;left:192px;top:1437px;width:435px;height:36px;border-radius:18px;background:#b6f2de;animation:appear 1s linear both}
.detail{position:absolute;left:192px;top:1527px;width:297px;height:24px;border-radius:12px;background:#edc588;animation:appear 1s linear both}
@keyframes appear{0%{opacity:0;transform:translateY(108px)}10%{opacity:1;transform:translateY(15px)}
 25%{opacity:1;transform:translateY(0)}65%{opacity:1;transform:translateY(0)}
 78%{opacity:1;transform:translateY(-12px)}90%{opacity:0;transform:translateY(-78px)}100%{opacity:0;transform:translateY(-78px)}}
</style>
</head>
<body>
<div id="alpha-stage" data-composition-id="original-alpha-overlay" data-no-timeline data-start="0" data-duration="1" data-width="1080" data-height="1920" data-fps="30">
  <div id="lower-third-plate" class="clip lower-third" data-start="0" data-duration="1" data-track-index="1"></div>
  <div id="lower-third-accent" class="clip accent" data-start="0" data-duration="1" data-track-index="2"></div>
  <div id="lower-third-detail" class="clip detail" data-start="0" data-duration="1" data-track-index="3"></div>
</div>
</body>
</html>
