<!doctype html><html lang="en"><meta charset="utf-8"><title>Original 3D Challenge Arena</title>
<style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#092654;font-family:Arial,sans-serif}#stage{position:relative;width:1080px;height:1920px;background:radial-gradient(circle at 49% 38%,#1a4a89,#092857 67%,#061739);overflow:hidden}canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block}#eye{position:absolute;top:120px;left:85px;width:910px;text-align:center;font-size:37px;letter-spacing:6px;color:#b0e4f4;font-weight:bold}#title{position:absolute;top:192px;left:85px;width:910px;text-align:center;font-size:105px;font-weight:950;color:#ffd875}#sub{position:absolute;top:325px;left:85px;width:910px;text-align:center;font-size:37px;color:#d5eafc;font-weight:600}#rank{position:absolute;top:1335px;left:90px;width:900px;height:360px;z-index:3;background:#092a64df;border:3px solid #60a7db;border-radius:35px;box-shadow:0 20px 75px #0007;padding:29px 42px;opacity:0;transform:translateY(65px)}#rank h2{margin:0;color:#ffdc78;text-align:center;font-size:56px}#rank .lane{height:29px;margin:24px auto 0;border-radius:25px;background:#244b80}#rank .lane span{display:block;height:100%;border-radius:25px;width:0;background:linear-gradient(90deg,#57c2e7,#a5e8e0)}#rank .label{font-size:25px;color:#c0dcee;margin-top:29px;text-align:center}#foot{position:absolute;bottom:86px;left:90px;color:#b0d2e7;font-size:29px;letter-spacing:3px}</style>
<body><main id="stage" data-composition-id="original-arena-three" data-duration="3.5666666666667" data-width="1080" data-height="1920" data-fps="30" data-renderer="three"><canvas id="three"></canvas><div id="eye">ORIGINAL COMPETITION DESIGN</div><div id="title">CHALLENGE MODE</div><div id="sub">Practice · React · Advance</div><div id="rank"><h2>RANKING MOMENTUM</h2><div class="lane"><span id="b0"></span></div><div class="lane"><span id="b1"></span></div><div class="lane"><span id="b2"></span></div><div class="label">Illustrative animation — no real player scores</div></div><div id="foot">MOMENTUM  →  NEXT CHAPTER</div></main>
<script type="module">
import * as T from '../../../node_modules/three/build/three.module.js';
const renderer=new T.WebGLRenderer({canvas:document.getElementById('three'),alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(1080,1920,false);renderer.setPixelRatio(1);renderer.setClearColor(0xffffff,0);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(34,1080/1920,.1,100);camera.position.set(0,0,17);camera.lookAt(0,0,0);scene.add(new T.AmbientLight(0xffffff,2.15));const light=new T.DirectionalLight(0xcde8ff,3.3);light.position.set(-5,7,9);scene.add(light);
const navy=new T.MeshStandardMaterial({color:0x0a224b,metalness:.4,roughness:.32}),silver=new T.MeshStandardMaterial({color:0x75a9e4,metalness:.72,roughness:.27}),gold=new T.MeshStandardMaterial({color:0xffbd58,metalness:.58,roughness:.25}),aqua=new T.MeshStandardMaterial({color:0x2dc7dd,metalness:.55,roughness:.3}),screenMat=new T.MeshBasicMaterial({color:0x00ff00,side:T.DoubleSide,depthWrite:true});
const phone=new T.Group();scene.add(phone);const back=new T.Mesh(new T.BoxGeometry(4.25,8.0,.27),navy);phone.add(back);const bezel=new T.Mesh(new T.BoxGeometry(4.42,8.18,.1),silver);bezel.position.z=-.02;phone.add(bezel);const glass=new T.Mesh(new T.PlaneGeometry(3.85,7.38),screenMat);glass.position.z=.16;phone.add(glass);
const arena=new T.Group();scene.add(arena);for(let i=0;i<4;i++){const m=new T.Mesh(new T.TorusGeometry(2.7+i*.45,.095,12,120,Math.PI*1.45),i%2?gold:aqua);m.rotation.x=1.29;m.position.set(0,-2.1+i*.54,-1.15);arena.add(m)}
const marks=[];for(let i=0;i<25;i++){let m=new T.Mesh(new T.OctahedronGeometry(.065+(i%3)*.021),i%2?gold:aqua);scene.add(m);marks.push(m)}
const smooth=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)},r=(t,a,b)=>smooth((t-a)/(b-a));
function renderAt(t){t=Math.max(0,Math.min(3.566666,t));let enter=r(t,0,.38),a=r(t,1.76,2.40),out=r(t,3.22,3.52);
 phone.position.set(1.2-1.2*enter,-.18-.7*a,.2);phone.rotation.y=-.27+.24*enter-.23*a;phone.rotation.z=.022*Math.sin(t*1.7);phone.scale.setScalar(.73+.08*enter-.09*a);
 arena.position.set(.0,-1.2,-.6);arena.rotation.y=t*.37;arena.scale.setScalar(.45+1.1*a);
 marks.forEach((m,j)=>{const th=2*Math.PI*j/25;m.position.set(Math.cos(th)*4.35,Math.sin(th)*6.65,-1.8+Math.sin(t*3+th)*.33);m.scale.setScalar(.3+.7*r(t,.82,2.3))});
 const rank=document.getElementById('rank');rank.style.opacity=String(a*(1-out));rank.style.transform=`translateY(${Math.round((1-a)*65)}px)`;
 [70,83,94].forEach((v,j)=>document.getElementById('b'+j).style.width=`${Math.round(v*r(t,2.14+j*.16,2.98+j*.09))}%`);
 renderer.render(scene,camera);
}
window.addEventListener('hf-seek',e=>renderAt(Number(e.detail.time)));renderAt(window.__hfThreeTime||0);
</script></body></html>
