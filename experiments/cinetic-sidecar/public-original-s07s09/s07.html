<!doctype html><html lang="en"><meta charset="utf-8"><title>Original Retrieval Motion</title>
<style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#f1f7fc;font-family:Arial, sans-serif}#stage{width:1080px;height:1920px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 30% 22%,#fffdf9,#e7f2fb 70%,#d5e5fa)}canvas{position:absolute;inset:0;display:block;width:1080px;height:1920px}#top{position:absolute;z-index:3;left:90px;top:124px;color:#1c5589;font-size:37px;letter-spacing:7px;font-weight:700}#hero{position:absolute;z-index:3;left:85px;top:225px;color:#133b72;font-size:85px;letter-spacing:-2px;font-weight:900;max-width:925px}#subtitle{position:absolute;z-index:3;left:100px;top:344px;color:#44739d;font-size:36px;font-weight:500}#note{position:absolute;z-index:3;left:90px;bottom:157px;color:#2e6098;font-size:38px;font-weight:800;letter-spacing:1px}#rule{position:absolute;z-index:3;left:95px;bottom:110px;width:0;height:9px;border-radius:9px;background:#42babb}#card{position:absolute;z-index:4;top:720px;left:142px;width:795px;border-radius:22px;background:#fffcf6ee;padding:36px 44px;box-shadow:0 17px 65px #1a427425;opacity:0;transform:translateY(40px)}#card>strong{display:block;color:#254e83;font-size:48px}#card span{display:block;color:#537b9e;font-size:28px;margin-top:11px}</style>
<body><main id="stage" data-composition-id="original-recall-three" data-width="1080" data-height="1920" data-fps="30" data-duration="2.3666666666667" data-renderer="three">
<canvas id="three"></canvas><div id="top">LEARNING SCIENCE</div><div id="hero">RETRIEVE · RECONNECT</div><div id="subtitle">From stored information to active recall</div><div id="card"><strong>Recall creates a pathway</strong><span>Original educational visualization · not a study screenshot</span></div><div id="note">EVIDENCE  →  PRACTICE</div><div id="rule"></div></main>
<script type="module">
import * as T from '../../../node_modules/three/build/three.module.js';
const canvas=document.getElementById('three'),renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(1080,1920,false);renderer.setPixelRatio(1);renderer.setClearColor(0xffffff,0);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(34,1080/1920,.1,100);cam.position.set(0,0,17);cam.lookAt(0,0,0);scene.add(new T.AmbientLight(0xffffff,2.2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-5,8,9);scene.add(light);
const white=new T.MeshPhysicalMaterial({color:0xfbfefa,roughness:.27,metalness:.09,clearcoat:.6}),blue=new T.MeshStandardMaterial({color:0x247bc3,roughness:.36,metalness:.28}),teal=new T.MeshStandardMaterial({color:0x1ac4ba,roughness:.3,metalness:.28}),gold=new T.MeshStandardMaterial({color:0xffba58,roughness:.35,metalness:.2});
const sheet=new T.Group();scene.add(sheet);let paper=new T.Mesh(new T.BoxGeometry(5.8,3.2,.2),white);sheet.add(paper);for(let j=0;j<5;j++){let line=new T.Mesh(new T.BoxGeometry(4.4,.042,.022),j<2?blue:teal);line.position.set(0,.86-j*.40,.126);sheet.add(line)}
const recall=new T.Group();scene.add(recall);const tor=new T.Mesh(new T.TorusGeometry(1.55,.083,20,116),teal);recall.add(tor);const nucleus=new T.Mesh(new T.IcosahedronGeometry(.58,2),blue);recall.add(nucleus);const second=new T.Mesh(new T.TorusGeometry(1.08,.07,16,104),gold);second.rotation.y=.5;recall.add(second);
const dots=[];for(let j=0;j<11;j++){const p=new T.Mesh(new T.SphereGeometry(.12,12,12),j%2?gold:teal);recall.add(p);dots.push(p)}
const trail=[];for(let j=0;j<12;j++){const m=new T.Mesh(new T.SphereGeometry(.085-j*.004,10,10),j%2?blue:teal);scene.add(m);trail.push(m)}
const smooth=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)},r=(t,a,b)=>smooth((t-a)/(b-a));
function renderAt(t){t=Math.max(0,Math.min(2.3666667,t));const a=r(t,.05,.5),b=r(t,.65,1.14),c=r(t,1.51,2.16);
 sheet.position.set(-3.2+3.2*a,1.75-.45*c,.2);sheet.rotation.y=.72-.72*a+.12*c;sheet.rotation.x=-.15+.1*a;sheet.scale.setScalar(.7+.1*a-.15*c);
 recall.position.set(.35,-2.0+1.1*b,1.3);recall.scale.setScalar(.1+.85*b);nucleus.rotation.y=t*1.9;tor.rotation.z=t*1.9;second.rotation.y=t*.9;
 dots.forEach((d,j)=>{let z=j/11*Math.PI*2+t*1.22;d.position.set(Math.cos(z)*1.55,Math.sin(z)*1.55,Math.sin(z*2)*.25)});
 trail.forEach((p,j)=>{let k=j/12,phase=Math.min(1,Math.max(0,(t-1.45)*1.7-k*.2));p.visible=phase>0;p.position.set(-1.6+7*k*phase,-4.8+3.2*Math.sin(k*2.5+phase*.9),-.5);p.scale.setScalar(.2+.8*phase)});
 document.getElementById('card').style.opacity=String(r(t,.48,.95)*(1-r(t,1.64,2.18)));document.getElementById('card').style.transform=`translateY(${Math.round(40*(1-r(t,.48,.95)))}px)`;
 document.getElementById('rule').style.width=`${Math.round(r(t,1.25,2.32)*880)}px`;
 renderer.render(scene,cam)
}
window.addEventListener('hf-seek',e=>renderAt(Number(e.detail.time)));renderAt(window.__hfThreeTime||0);
</script></body></html>
