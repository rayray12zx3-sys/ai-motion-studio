<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three.js real depth + shader wipe R&D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030c15;color:white;font-family:Arial,Helvetica,sans-serif}#stage{width:min(56.25vh,100vw);height:100vh;position:relative;overflow:hidden;margin:auto;background:#041320}#view{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none;padding:7%;display:flex;flex-direction:column;justify-content:flex-start;gap:2.5%}.eyebrow{color:#81f4cf;font-size:clamp(12px,1.7vh,24px);letter-spacing:.3em}.title{font-size:clamp(30px,5.8vh,90px);font-weight:900;line-height:.95;letter-spacing:-.05em;max-width:90%}.footer{margin-top:auto;border-top:1px solid #7ca9a9;padding-top:3%;font-size:clamp(10px,1.3vh,20px);letter-spacing:.13em;color:#bfdbe0}
</style></head><body><main id="stage" data-composition-id="three-depth-rnd" data-duration="10" data-width="1080" data-height="1920"><canvas id="view" width="1080" height="1920"></canvas><section class="overlay"><div class="eyebrow">CODED MOTION / TRUE 3D</div><div class="title">FORM<br>IN<br>SPACE.</div><div class="footer">PROCEDURAL OBJECTS · REAL CAMERA · LIGHTING · SHADER TRANSITION<br>RESEARCH-ONLY — CREATIVE QUALITY UNAPPROVED</div></section></main>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';
import {createThreeDepthRig} from '../src/three-depth.mjs';
import {createShaderTransition} from '../src/shader-transition.mjs';
import {projectHeroBounds,assertNoProtectedOcclusion,htmlRectToCanvasDesign} from '../src/three-layout-audit.mjs';
const first=createThreeDepthRig({THREE,width:1080,height:1920,fps:30,frames:300,palette:'mint'});
const second=createThreeDepthRig({THREE,width:1080,height:1920,fps:30,frames:300,palette:'lavender'});
const renderer=first.makeRenderer({canvas:document.querySelector('#view')});
const wipe=createShaderTransition({THREE,renderer,width:1080,height:1920});
const seekFrame=(frame)=>{
 if(!Number.isInteger(frame)||frame<0||frame>=300)throw Error('Bad frame');
 const a=first.seekFrame(frame),b=second.seekFrame(frame),t=frame/30;
 if(t<4.25)renderer.render(first.scene,first.camera);
 else if(t>5.05)renderer.render(second.scene,second.camera);
 else {let p=(t-4.25)/.8; p=p*p*(3-2*p);wipe.render(first,second,p)}
 return {frame,a,b,shaderProgress:wipe.uniforms.uProgress.value};
};
window.seekFrame=seekFrame;
window.auditProtectedRegions=()=>{
  // Two authored foreground film regions. A 3D surface may not obscure or
  // visually compete with either; atmospheric shader is intentionally excluded.
  const canvas=document.querySelector('#view');
  const cr=canvas.getBoundingClientRect();
  const regions=['.title','.footer'].map(sel=>({name:sel.slice(1),bounds:htmlRectToCanvasDesign(document.querySelector(sel).getBoundingClientRect(),cr,1080,1920)}));
  const firstBounds=projectHeroBounds({THREE,object:first.hero,camera:first.camera,width:1080,height:1920});
  const secondBounds=projectHeroBounds({THREE,object:second.hero,camera:second.camera,width:1080,height:1920});
  return {first:assertNoProtectedOcclusion({hero:firstBounds,protectedRegions:regions}),second:assertNoProtectedOcclusion({hero:secondBounds,protectedRegions:regions}),regions,firstBounds,secondBounds};
};
window.addEventListener('hf-seek',e=>seekFrame(Math.min(299,Math.max(0,Math.floor(e.detail.time*30)))));
window.threeAudit={version:THREE.REVISION,actualWebGL:renderer.isWebGLRenderer,frameCount:300,objects:first.hero.children.length,shader:true};
seekFrame(0);
</script></body></html>
