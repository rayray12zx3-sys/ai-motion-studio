<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three.js real depth + shader wipe R&D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030c15;color:white;font-family:Arial,Helvetica,sans-serif}#stage{width:min(56.25vh,100vw);height:100vh;position:relative;overflow:hidden;margin:auto;background:#041320}#view{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none;padding:7%;display:flex;flex-direction:column;justify-content:flex-start;gap:2.5%}.eyebrow{color:#81f4cf;font-size:clamp(12px,1.7vh,24px);letter-spacing:.3em}.title{font-size:clamp(30px,5.8vh,90px);font-weight:900;line-height:.95;letter-spacing:-.05em;max-width:90%;position:relative;min-height:22vh}.title-word{position:absolute;top:0;left:0;right:0;opacity:0;will-change:transform,opacity}.footer{margin-top:auto;border-top:1px solid #7ca9a9;padding-top:3%;font-size:clamp(10px,1.3vh,20px);letter-spacing:.13em;color:#bfdbe0}
</style></head><body><main id="stage" data-composition-id="three-depth-rnd" data-duration="10" data-width="1080" data-height="1920"><canvas id="view" width="1080" height="1920"></canvas><section class="overlay"><div class="eyebrow">CODED MOTION / TRUE 3D</div><div class="title"><div class="title-word" id="titleA">FORM<br>IN<br>SPACE.</div><div class="title-word" id="titleB">SIGNAL<br>IN<br>MOTION.</div></div><div class="footer">PROCEDURAL OBJECTS · REAL CAMERA · LIGHTING · SHADER TRANSITION<br>RESEARCH-ONLY — CREATIVE QUALITY UNAPPROVED</div></section></main>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';
import {createThreeDepthRig} from '../src/three-depth.mjs';
import {createDataSculptureRig} from '../src/data-sculpture-rig.mjs';
import {createShaderTransition} from '../src/shader-transition.mjs';
import {compileShotChoreography} from '../src/shot-choreography.mjs';
import {compileCameraChoreography,auditCameraMotion} from '../src/camera-choreography.mjs';
import {projectHeroBounds,assertNoProtectedOcclusion,htmlRectToCanvasDesign} from '../src/three-layout-audit.mjs';
import {fitPerShotHeroLayout} from '../src/shot-layout-solver.mjs';
const cameraMint=compileCameraChoreography({frames:300,keys:[
 {frame:0,x:-.55,y:.12,z:12.3,lookX:0,lookY:0,lookZ:0},
 {frame:100,x:.30,y:.20,z:11.8,lookX:.10,lookY:.03,lookZ:0},
 {frame:205,x:-.18,y:-.18,z:12.1,lookX:0,lookY:.05,lookZ:0},
 {frame:299,x:.20,y:.05,z:12.5,lookX:0,lookY:0,lookZ:0}
]});
const cameraLavender=compileCameraChoreography({frames:300,keys:[
 {frame:0,x:.30,y:-.12,z:12.4,lookX:0,lookY:0,lookZ:0},
 {frame:105,x:-.30,y:.16,z:11.9,lookX:0,lookY:.02,lookZ:0},
 {frame:205,x:.25,y:.10,z:12.0,lookX:-.04,lookY:0,lookZ:0},
 {frame:299,x:-.15,y:.02,z:12.5,lookX:0,lookY:0,lookZ:0}
]});
if(!auditCameraMotion(cameraMint).passed||!auditCameraMotion(cameraLavender).passed)throw Error('3D cinematic camera motion exceeds safe speed');
const first=createThreeDepthRig({THREE,width:1080,height:1920,fps:30,frames:300,palette:'mint',cameraPath:cameraMint});
const second=createDataSculptureRig({THREE,width:1080,height:1920,fps:30,frames:300,cameraPath:cameraLavender});
const film=compileShotChoreography({fps:30,frames:300,shots:[
 {id:'orbital-arrival',rig:'mint',start:0,end:153,titleHold:[15,95]},
 {id:'orbital-resolution',rig:'lavender',start:127,end:300,titleHold:[175,280]}
]});
const cv=document.querySelector('#view');const cvRect=cv.getBoundingClientRect();
const protectedRegions=['.title','.footer'].map(sel=>({name:sel.slice(1),bounds:htmlRectToCanvasDesign(document.querySelector(sel).getBoundingClientRect(),cvRect,1080,1920)}));
const fit=fitPerShotHeroLayout({THREE,entries:[{id:'orbital-arrival',rig:first,start:0,end:153},{id:'data-sculpture-resolution',rig:second,start:127,end:300}],protectedRegions,width:1080,height:1920});
if(!window.gsap||window.gsap.version!=='3.15.0')throw Error('Actual locally pinned GSAP 3.15 runtime missing');
const typeTimeline=window.gsap.timeline({paused:true});
typeTimeline.fromTo('#titleA',{opacity:0,y:52},{opacity:1,y:0,duration:.55,ease:'power4.out'},.10);
typeTimeline.to('#titleA',{opacity:0,y:-54,duration:.45,ease:'power3.in'},4.20);
typeTimeline.fromTo('#titleB',{opacity:0,y:52},{opacity:1,y:0,duration:.65,ease:'power4.out'},4.62);
const titleState=()=>({a:Number(getComputedStyle(document.querySelector('#titleA')).opacity),b:Number(getComputedStyle(document.querySelector('#titleB')).opacity)});
const renderer=first.makeRenderer({canvas:cv});
const wipe=createShaderTransition({THREE,renderer,width:1080,height:1920});
const seekFrame=(frame)=>{
 if(!Number.isInteger(frame)||frame<0||frame>=300)throw Error('Bad frame');
 const a=first.seekFrame(frame),b=second.seekFrame(frame),shot=film.at(frame);
 // One continuous display color pipeline for every frame; p=0/1 produce
 // first/second scene using the SAME compositor as overlapping frames.
 const displayProgress=shot.active.length===1?(shot.rigs[0]==='mint'?0:1):shot.progress;
 wipe.render(first,second,displayProgress);
 typeTimeline.time(frame/30,true);
 return {frame,a,b,shot,typography:titleState(),shaderProgress:wipe.uniforms.uProgress.value};
};
window.seekFrame=seekFrame;
window.auditProtectedRegions=()=>{
  // Two authored foreground film regions. A 3D surface may not obscure or
  // visually compete with either; atmospheric shader is intentionally excluded.
  const canvas=document.querySelector('#view');
  const cr=canvas.getBoundingClientRect();
  const regions=['.title','.footer'].map(sel=>({name:sel.slice(1),bounds:htmlRectToCanvasDesign(document.querySelector(sel).getBoundingClientRect(),cr,1080,1920)}));
  const firstBounds=projectHeroBounds({THREE,object:first.hero,camera:first.camera,width:1080,height:1920});
  const secondBounds=projectHeroBounds({THREE,object:second.hero,camera:second.camera,width:1080,height:1920});
  return {first:assertNoProtectedOcclusion({hero:firstBounds,protectedRegions:regions}),second:assertNoProtectedOcclusion({hero:secondBounds,protectedRegions:regions}),regions,firstBounds,secondBounds};
};
window.addEventListener('hf-seek',e=>seekFrame(Math.min(299,Math.max(0,Math.floor(e.detail.time*30)))));
window.threeAudit={version:THREE.REVISION,actualWebGL:renderer.isWebGLRenderer,frameCount:300,objects:first.hero.children.length,shader:true,fit,cameraPaths:true,gsapHybrid:true,distinct3dRigs:true,gsapVersion:window.gsap.version,shots:film.shots.map(({id,start,end})=>({id,start,end})),transitions:film.transitions.map(({from,to,start,end})=>({from,to,start,end}))};
seekFrame(0);
</script></body></html>
