<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three.js real depth + shader wipe R&D</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030c15;color:white;font-family:Arial,Helvetica,sans-serif}#stage{width:min(56.25vh,100vw);height:100vh;position:relative;overflow:hidden;margin:auto;background:#041320}#view{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none;padding:7%;display:flex;flex-direction:column;justify-content:flex-start;gap:2.5%}.eyebrow{color:#81f4cf;font-size:clamp(12px,1.7vh,24px);letter-spacing:.3em}.title{font-size:clamp(30px,5.8vh,90px);font-weight:900;line-height:.95;letter-spacing:-.05em;max-width:90%}.footer{margin-top:auto;border-top:1px solid #7ca9a9;padding-top:3%;font-size:clamp(10px,1.3vh,20px);letter-spacing:.13em;color:#bfdbe0}
</style></head><body><main id="stage" data-composition-id="three-depth-rnd" data-duration="10" data-width="1080" data-height="1920"><canvas id="view" width="1080" height="1920"></canvas><section class="overlay"><div class="eyebrow">CODED MOTION / TRUE 3D</div><div class="title">FORM<br>IN<br>SPACE.</div><div class="footer">PROCEDURAL OBJECTS · REAL CAMERA · LIGHTING · SHADER TRANSITION<br>RESEARCH-ONLY — CREATIVE QUALITY UNAPPROVED</div></section></main>
<script type="module">
import * as THREE from '../node_modules/three/build/three.module.js';
import {createThreeDepthRig} from '../src/three-depth.mjs';
import {createShaderTransition} from '../src/shader-transition.mjs';
import {compileShotChoreography} from '../src/shot-choreography.mjs';
import {createShotStagePlayer} from '../src/shot-stage-player.mjs';
import {projectHeroBounds,assertNoProtectedOcclusion,htmlRectToCanvasDesign,fitFixedHeroScale} from '../src/three-layout-audit.mjs';
const threeShot=new URLSearchParams(location.search).get('variation')==='three';
const first=createThreeDepthRig({THREE,width:1080,height:1920,fps:30,frames:300,palette:'mint'});
const second=createThreeDepthRig({THREE,width:1080,height:1920,fps:30,frames:300,palette:'lavender'});
const third=threeShot?createThreeDepthRig({THREE,width:1080,height:1920,fps:30,frames:300,palette:'copper'}):null;
const rigs={mint:first,lavender:second};if(third)rigs.copper=third;
const film=compileShotChoreography({fps:30,frames:300,shots:threeShot?[
 {id:'approach',rig:'mint',start:0,end:116,titleHold:[15,80]},
 {id:'exchange',rig:'lavender',start:96,end:220,titleHold:[125,170]},
 {id:'outcome',rig:'copper',start:199,end:300,titleHold:[230,288]}
]:[
 {id:'orbital-arrival',rig:'mint',start:0,end:153,titleHold:[15,95]},
 {id:'orbital-resolution',rig:'lavender',start:127,end:300,titleHold:[175,280]}
]});
const usedRigs=[...new Set(film.shots.map(s=>s.rig))].map(key=>rigs[key]);
const cv=document.querySelector('#view');const cvRect=cv.getBoundingClientRect();
const protectedRegions=['.title','.footer'].map(sel=>({name:sel.slice(1),bounds:htmlRectToCanvasDesign(document.querySelector(sel).getBoundingClientRect(),cvRect,1080,1920)}));
const fit=fitFixedHeroScale({THREE,rigs:usedRigs,protectedRegions,width:1080,height:1920,frames:300});
const renderer=first.makeRenderer({canvas:cv});
const wipe=createShaderTransition({THREE,renderer,width:1080,height:1920});
const player=createShotStagePlayer({timeline:film,rigs,renderer,transition:wipe});
const seekFrame=(frame)=>{const state=player.seekFrame(frame);return {frame,shot:state,shaderProgress:state.shaderProgress};};
window.seekFrame=seekFrame;
window.auditProtectedRegions=()=>{
  const canvas=document.querySelector('#view');const cr=canvas.getBoundingClientRect();
  const regions=['.title','.footer'].map(sel=>({name:sel.slice(1),bounds:htmlRectToCanvasDesign(document.querySelector(sel).getBoundingClientRect(),cr,1080,1920)}));
  const bounds=usedRigs.map(rig=>projectHeroBounds({THREE,object:rig.hero,camera:rig.camera,width:1080,height:1920}));
  const checks=bounds.map(hero=>assertNoProtectedOcclusion({hero,protectedRegions:regions}));
  return {first:checks[0],second:checks[1],third:checks[2]??null,rigChecks:checks,regions,firstBounds:bounds[0],secondBounds:bounds[1]};
};
window.addEventListener('hf-seek',e=>seekFrame(Math.min(299,Math.max(0,Math.floor(e.detail.time*30)))));
window.threeAudit={version:THREE.REVISION,actualWebGL:renderer.isWebGLRenderer,frameCount:300,objects:first.hero.children.length,shader:true,fit,variation:threeShot?'three':'two',rigCount:usedRigs.length,shots:film.shots.map(({id,start,end})=>({id,start,end})),transitions:film.transitions.map(({from,to,start,end})=>({from,to,start,end}))};
seekFrame(0);
</script></body></html>
