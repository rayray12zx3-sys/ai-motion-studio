<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original Coded Motion Capability: Orbital Circuit</title>
<style>

<svg id="film" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" aria-label="Original multi-layer kinetic-tech creative test">

  <radialGradient id="center"><stop stop-color="#8ff5d4" stop-opacity=".5"/><stop offset=".6" stop-color="#4489c4" stop-opacity=".16"/><stop offset="1" stop-color="#080e1a" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="inner-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>

 <path d="M470 1072 L608 1072 M540 1005 V1142" stroke="#7ebfe2" stroke-width="3" opacity=".6"/>
</g>

 <circle cx="360" cy="1360" r="5" fill="#92f5dc" stroke="none"/><circle cx="780" cy="805" r="5" fill="#92f5dc" stroke="none"/>
 <text x="126" y="1450" fill="#92e5dd" stroke="none" font-size="18" letter-spacing="4">SYSTEM / 01</text><text x="766" y="744" fill="#96b3d1" stroke="none" font-size="18" letter-spacing="3">VECTOR FIELD</text></g>
<g data-motion-id="title" clip-path="url(#typeMask)">
 <text x="102" y="322" fill="#9ff9df" font-size="25" font-weight="700" letter-spacing="10">MOTION DESIGN SYSTEM</text>
 <text x="92" y="435" fill="#f4f4e6" font-size="110" font-weight="900" letter-spacing="-5">IDEAS</text>

 <path id="titleUnderline" d="M100 588 H948" stroke="#91f4dd" stroke-width="4"/>
 <text x="104" y="636" fill="#b7c6d9" font-size="27" letter-spacing="2">A persistent object across an evolving world.</text>

 <g id="satelliteFollower"><g id="satelliteSpin"><circle cx="0" cy="0" r="29" fill="#041d30" stroke="#dcfff3" stroke-width="5"/><circle cx="0" cy="0" r="10" fill="#d9fff2"/><path d="M-52 0 H-33 M33 0 H52 M0 -51 V-32 M0 32 V51" stroke="#9cf3dc" stroke-width="5"/></g></g>
</g>
<g data-motion-id="foreground"><path d="M0 93 H1080 M0 1830 H1080" stroke="#aec1d1" opacity=".42" stroke-width="2"/><text x="100" y="122" font-size="24" fill="#a7bcd0" letter-spacing="4">FIELD RESEARCH / 2026</text><text x="980" y="122" text-anchor="end" font-size="24" fill="#b1c2d3" letter-spacing="2">/ 001</text><text x="100" y="1785" font-size="23" fill="#9aafc8" letter-spacing="5">CODED MOTION · DEPTH · CONTINUITY</text></g>
</g><g id="paint"></g>
</svg><div id="status">TECHNICAL BENCHMARK · NOT AN APPROVED FILM</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
<script type="module">
import {compileSpatialGraph,auditFrameRange,auditBeatPlan} from '../src/spatial-graph.mjs';
import {createCodedSpatialStage} from '../src/tech-stage-bridge.mjs';
const graph=compileSpatialGraph({
 width:1080,height:1920,fps:30,frames:300,
 camera:{x:[{frame:0,value:-28},{frame:60,value:0},{frame:299,value:32}],y:[{frame:0,value:24},{frame:299,value:-26}],zoom:[{frame:0,value:1.025},{frame:299,value:1.045}]},
 nodes:[
 {id:'background',role:'surface',width:1080,height:1920,plane:-100},
 {id:'background-grid',role:'art',width:1080,height:1920,plane:-90,depth:-180},
 {id:'ambient',role:'art',width:1080,height:1920,plane:-80,depth:-70},
 {id:'orbit-rig',role:'group',x:0,y:0,clip:{x:75,y:700,width:935,height:850}},
 {id:'portal-shadow',parent:'orbit-rig',role:'art',width:1080,height:1920,plane:0},
 {id:'portal-shell',parent:'orbit-rig',role:'surface',width:1080,height:1920,plane:5,depth:3},
 {id:'circuit-network',parent:'orbit-rig',role:'art',width:1080,height:1920,plane:10},
 {id:'inner-core',parent:'orbit-rig',role:'art',width:1080,height:1920,plane:15},
 {id:'orbit-rail',role:'orbit',width:1080,height:1920,plane:30},
 {id:'information-panels',role:'annotation',width:1080,height:1920,plane:35},
 {id:'title',role:'text',x:0,y:0,boundsX:92,boundsY:300,width:870,height:350,plane:65,protect:true},
 {id:'satellite',role:'art',width:60,height:60,plane:90},
 {id:'foreground',role:'annotation',width:1080,height:1920,plane:130}
 ],
 tracks:[
 {id:'orbit-rig',field:'scaleX',keyframes:[{frame:0,value:.87},{frame:90,value:1},{frame:180,value:1.04},{frame:299,value:1}]},
 {id:'orbit-rig',field:'scaleY',keyframes:[{frame:0,value:.87},{frame:90,value:1},{frame:180,value:1.04},{frame:299,value:1}]},
 {id:'orbit-rig',field:'opacity',keyframes:[{frame:0,value:.10},{frame:55,value:1},{frame:299,value:1}]},
 {id:'ambient',field:'opacity',keyframes:[{frame:0,value:.3},{frame:110,value:.8},{frame:299,value:.5}]},
 {id:'title',field:'y',keyframes:[{frame:0,value:20},{frame:52,value:0},{frame:299,value:0}]},
 {id:'title',field:'opacity',keyframes:[{frame:0,value:0},{frame:35,value:1},{frame:299,value:1}]},
 ]
});
const svg=document.querySelector('#film');
// Real specialist libraries: timeline controls complex shape, stroke reveals, orbit, internal rotation.
if(!window.gsap||!window.MorphSVGPlugin||!window.DrawSVGPlugin||!window.MotionPathPlugin)throw Error('Actual GSAP plugin runtime required');
// One bridge unifies parent-group world transforms and actual GSAP technique tracks.
const stage=createCodedSpatialStage({graph,svg,paintLayer:document.querySelector('#paint'),gsap,MorphSVGPlugin,DrawSVGPlugin,MotionPathPlugin});
const node=(id)=>svg.querySelector('#'+id);
stage.pathMorph(node('heroPath'),{shape:'#shapeTarget',at:3.0,seconds:2.75,type:'rotational',smooth:28});
stage.draw(node('circuitA'),{at:1.4,seconds:2.2});
stage.draw(node('circuitB'),{at:2.5,seconds:2.1});
stage.draw(node('orbitPath'),{at:3.4,seconds:2.5});
stage.orbit(node('satelliteFollower'),{path:node('orbitPath'),at:.35,seconds:8.8,autoRotate:true});
stage.spin(node('satelliteSpin'),{at:.2,seconds:9,degrees:360});
stage.draw(node('titleUnderline'),{at:.9,seconds:1.35,ease:'power3.out'});
stage.spin(node('core-ring'),{at:0,seconds:9.5,degrees:210});
window.seekFrame=(frame)=>stage.seekFrame(frame);
window.motionTechAudit={version:gsap.version,plugins:['MorphSVG','DrawSVG','MotionPath'],sceneNodes:graph.nodeCount,frameCount:graph.frames,initial:graph.sample(0).issues.length,beatAudit:auditBeatPlan({fps:30,frames:300,beats:[
 {id:'title',start:18,end:100,readable:true},
 {id:'circuit-network',start:43,end:115,focal:true},
 {id:'satellite',start:115,end:290,focal:true},
 {id:'portal-morph',start:130,end:210,focal:true},
 ]})};
window.seekFrame(0);
</script></body></html>
