<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isolated S1 geometry-v2 interactive study</title></head>
<body>
<h1>Original synthetic geometry-v2 editor study</h1>
<p>Only a disposable, in-memory research canvas. No project save/import or production rollout.</p>
<section aria-label="Rectangle geometry">
<label for="rect-width">Rectangle width (normalized)</label>
<input id="rect-width" type="number" min="0.01" max="1.5" step="0.01" value="0.78">
<label for="rect-height">Rectangle height (normalized)</label>
<input id="rect-height" type="number" min="0.01" max="1.5" step="0.01" value="0.255">
<button id="apply-rect" type="button">Apply rectangle size</button>
<button id="shrink" type="button">Shrink panel</button>
<button id="restore" type="button">Restore panel</button>
</section>
<section aria-label="Text layout">
<label for="font-size">Headline font size (normalized)</label>
<input id="font-size" type="number" min="0.012" max="0.16" step="0.001" value="0.064">
<label for="max-width">Headline max width (normalized)</label>
<input id="max-width" type="number" min="0.1" max="1.5" step="0.01" value="0.69">
<label for="text-align">Headline alignment</label>
<select id="text-align"><option value="left">Left</option>
<option selected value="center">Center</option><option value="right">Right</option></select>
<button id="apply-text" type="button">Apply text layout</button>
</section>
<section aria-label="Local research history">
<button id="undo" type="button">Undo</button>
<button id="redo" type="button">Redo</button>
</section>
<div id="stage" aria-label="Original synthetic Konva study stage"></div>
<output id="status">Loading original geometry-v2 fixture…</output>
<script src="/konva.min.js"></script><script type="module" src="/browser-client.mjs"></script>
</body></html>
