<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<style>
@import url('/fonts/chinese-traditional-700.css');
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:'Noto Sans TC',sans-serif;color:#fff}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
#sentence{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(70px,5.2vw,120px);white-space:nowrap;letter-spacing:-.03em}
#sentence span{position:relative;display:inline-block}
#handoff{position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:0}
#mask{position:absolute;left:11%;top:37%;width:78%;height:30%;overflow:hidden}
#maskText{font-size:72px;font-weight:700;white-space:nowrap}
#beat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:82px;font-weight:700;letter-spacing:-.02em}
</style></head><body><div id="stage"><div id="sentence"></div><div id="handoff"></div>
<div id="mask"><div id="maskText">你確定？</div></div><div id="beat"></div></div>
<script>
const params=new URLSearchParams(location.search),recipe=params.get('recipe')||'K01';
const sentence=document.getElementById('sentence'),handoff=document.getElementById('handoff'),mask=document.getElementById('mask'),maskText=document.getElementById('maskText'),beat=document.getElementById('beat');
const clamp=x=>Math.min(1,Math.max(0,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const spring=x=>{x=clamp(x);return 1+Math.exp(-7*x)*Math.sin(16*x)*.22};
sentence.innerHTML=['真','的','假','的','？！'].map(c=>'<span>'+c+'</span>').join('');
window.renderAt=function(t){
 sentence.style.display=recipe==='K01'?'flex':'none';
 handoff.style.opacity=recipe==='K09'?'1':'0';
 mask.style.display=recipe==='K09'?'block':'none';
 beat.style.display=recipe==='K19'?'flex':'none';
 if(recipe==='K01'){
  [...sentence.children].forEach((s,i)=>{
   const x=clamp((t-.10-i*.12)/.72);
   const squeeze=x<.35?(.3+.7*ease(x/.35)):spring((x-.35)/.65);
   s.style.transform='translateY('+((1-ease(x))*23).toFixed(5)+'px) scaleX('+squeeze.toFixed(6)+')';
   s.style.opacity=clamp(x*8).toFixed(6);
  });
 }
 if(recipe==='K09'){
  const progress=ease((t-.27)/.85),dotX=520-420*progress,dotY=180+progress*20;
  handoff.style.left=dotX.toFixed(4)+'px';handoff.style.top=dotY.toFixed(4)+'px';
  handoff.style.transform='translate(-50%,-50%) scale('+(1+1.3*ease((t-1)/.4)).toFixed(5)+')';
  mask.style.clipPath='inset(0 '+(100-ease((t-.42)/.68)*100).toFixed(6)+'% 0 0)';
  maskText.style.transform='translateX('+((1-ease((t-.42)/.68))*18).toFixed(4)+'px)';
  handoff.style.opacity=(1-ease((t-1.13)/.22)).toFixed(5);
 }
 if(recipe==='K19'){
  let label,offset=0,scale=1;
  if(t<.54){label='先等等';offset=110*(1-ease((t-.12)/.3));}
  else if(t<1.02){label='注意！';scale=.78+.22*ease((t-.54)/.24);}
  else{label='現在開始';scale=.72+.28*spring((t-1.02)/.4);}
  if(beat.textContent!==label)beat.textContent=label;
  beat.style.transform='translateX('+offset.toFixed(4)+'px) scale('+scale.toFixed(5)+')';
 }
};
window.renderAt(0);
</script></body></html>
