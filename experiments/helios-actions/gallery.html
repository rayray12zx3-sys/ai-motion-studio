<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<style>
@import url('/fonts/chinese-traditional-700.css');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:'Noto Sans TC',sans-serif;font-weight:700;color:#f5f7fa}
#frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:960px;height:540px;flex:none;position:relative;overflow:hidden;transform-origin:center center}
.g{position:absolute;white-space:pre;transform-origin:center center;will-change:transform,opacity,clip-path}
.ink{color:#f7f9fb}.soft{color:#97c9da}.dim{color:#8d95a8}
.rule{position:absolute;height:4px;background:#98d8e5;transform-origin:left center}
</style></head><body><div id="frame"><div id="stage"></div></div><script>
const stage=document.getElementById('stage');
const id=new URL(location.href).searchParams.get('recipe')||'K01';
const clamp=x=>Math.max(0,Math.min(1,x)), mix=(a,b,x)=>a+(b-a)*x;
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const cubic=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.28;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const damp=x=>{x=clamp(x);return 1-Math.exp(-8*x)*Math.cos(13*x)};
const show=(el,x)=>{el.style.opacity=clamp(x).toFixed(5)};
const at=(el,x,y,scale=1,rotation=0)=>el.style.transform='translate('+x.toFixed(3)+'px,'+y.toFixed(3)+'px) rotate('+rotation.toFixed(4)+'deg) scale('+scale.toFixed(5)+')';
const item=(txt,x,y,size=88,color='ink',extra={})=>{
 const el=document.createElement('div');el.className='g '+color;el.textContent=txt;
 Object.assign(el.style,{left:x+'px',top:y+'px',fontSize:size+'px',lineHeight:'1.18',fontWeight:700,letterSpacing:'-0.045em',...extra});
 stage.append(el);return el;
};
const rule=(x,y,w=260,h=4)=>{const el=document.createElement('div');el.className='rule';Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});stage.append(el);return el;};
const letters=(str,left,y,size=100,advance=92)=>{
 return [...str].map((s,i)=>item(s,left+i*advance,y,size));
};
const scale=Math.min(innerWidth/960,innerHeight/540);stage.style.transform='scale('+scale+')';
let update;
if(id==='K01'){ // Per-glyph compression with anticipated recoil; no whole-card zoom.
 const g=letters('不可能',321,206,118,106);
 const s=item('重量由筆畫自己承受',365,359,22,'dim',{letterSpacing:'.08em'});
 update=t=>{g.forEach((e,i)=>{const p=clamp((t-.15-i*.16)/.92);
   const sx=p<.22?mix(1,.34,smooth(p/.22)):mix(.34,1.0,damp((p-.22)/.78));
   const sy=p<.22?mix(1,1.25,smooth(p/.22)):mix(1.25,1,damp((p-.22)/.78));
   e.style.transform='scaleX('+sx.toFixed(5)+') scaleY('+sy.toFixed(5)+') translateY('+((1-smooth(p))*19).toFixed(3)+'px)';
   show(e,clamp((t-i*.13)/.12));});
   show(s,smooth((t-1.12)/.35));
 };
}else if(id==='K03'){ // Animated tracking: fixed glyph shapes, changing negative space.
 const g=letters('想清楚',300,207,111,108);const small=item('每個空白都決定節奏',342,358,22,'dim');
 update=t=>{let w=180-124*smooth((t-.18)/.75)+54*smooth((t-1.4)/.38);
   g.forEach((e,i)=>{const x=(i-1)*w;at(e,x,0);show(e,smooth((t-.08-i*.08)/.28));});
   show(small,smooth((t-.99)/.4));
 };
}else if(id==='K04'){ // Three continuous horizontal slices of ONE line, geometrically joining.
 const full='原來如此',x=297,y=201;
 const slices=[0,1,2].map(i=>{
  const e=item(full,x,y,97,'ink',{letterSpacing:'-.045em'});
  e.style.clipPath='inset('+(i*34)+'% 0 '+(100-(i+1)*34)+'% 0)';
  return e;});
 const baseline=rule(304,344,352,2);
 update=t=>{slices.forEach((e,i)=>{const p=smooth((t-.10-i*.08)/.82);
   const dir=[-1,1,-1][i];at(e,dir*mix(250,0,p),[34,-34,24][i]*(1-p),1,(1-p)*dir*3);
   show(e,smooth((t-.08-i*.08)/.28));});
   baseline.style.transform='scaleX('+smooth((t-1.04)/.43).toFixed(5)+')';
   show(baseline,smooth((t-1.04)/.2));
 };
}else if(id==='K05'){ // Three different word groups carry typographic emphasis in sequence.
 const pieces=[item('這',254,201,112),item('才是',366,203,96,'soft'),item('重點',575,200,107)];
 const num=item('01 / 03',421,355,21,'dim',{letterSpacing:'.08em'});
 update=t=>{pieces.forEach((e,i)=>{
    const start=.11+i*.49,focus=smooth((t-start)/.18)*(1-smooth((t-start-.44)/.19));
    const end=smooth((t-start)/.3);
    at(e,0,-18*focus,1+focus*.16);
    e.style.color=focus>.03?'#97dbea':'#f6f8fa';
    show(e,end);
   });
   num.textContent=t<.58?'01 / 03':t<1.06?'02 / 03':'03 / 03';
   show(num,smooth((t-.15)/.34));
 };
}else if(id==='K06'){ // Semantic collision: two opposing lines share a central contact point.
 const left=item('太快！',170,205,104),right=item('等等！',532,205,104,'soft');
 const bar=rule(478,208,4,125);bar.style.transformOrigin='center center';
 update=t=>{const a=smooth((t-.1)/.65),hit=smooth((t-.62)/.18),release=damp((t-.91)/.73);
   at(left,mix(-230,89,a)-78*hit*release,0,1-.15*hit*(1-release));
   at(right,mix(230,-89,a)+78*hit*release,0,1-.15*hit*(1-release));
   show(left,smooth((t-.08)/.16));show(right,smooth((t-.15)/.16));
   bar.style.transform='scaleY('+hit.toFixed(4)+')';show(bar,hit*(1-smooth((t-1.08)/.3)));
 };
}else if(id==='K07'){ // Meaningful line fold: words reshuffle into an aligned two-line composition.
 const a=item('想得美',300,196,105),b=item('做得更美',516,197,89,'soft');
 const line=rule(301,343,450,3);
 update=t=>{const p=smooth((t-.42)/.76),q=smooth((t-.1)/.25);
   at(a,mix(0,-11,p),mix(0,-82,p),mix(1,1.04,p));
   at(b,mix(0,-217,p),mix(0,80,p),mix(.88,1,p));
   show(a,q);show(b,smooth((t-.30)/.25));
   line.style.transform='scaleX('+smooth((t-1.05)/.52).toFixed(5)+')';
   show(line,smooth((t-.96)/.25));
 };
}else if(id==='K09'){ // Punctuation anchor becomes precise reveal pivot for second sentence.
 const old=item('真的嗎？',278,207,104),next=item('你確定？',311,205,107);
 const dot=item('·',621,247,91,'soft');
 update=t=>{const inP=smooth((t-.04)/.35),handoff=smooth((t-.66)/.6),reveal=smooth((t-.75)/.65);
   at(old,-100*handoff,0,1-.13*handoff);show(old,inP*(1-smooth((t-.62)/.36)));
   next.style.clipPath='inset(0 '+(100-100*reveal).toFixed(4)+'% 0 0)';
   at(next,mix(34,0,reveal),0);show(next,reveal);
   at(dot,-177*handoff,(-20)*handoff,1+1.2*Math.sin(Math.PI*handoff));
   show(dot,smooth((t-.27)/.23)*(1-smooth((t-1.29)/.26)));
 };
}else if(id==='K10'){ // Text/counterpart rule link, composition changes without exiting scene.
 const top=item('請看這裡',280,178,117);
 const second=item('重點就在下一行',307,321,45,'soft');
 const ln=rule(291,308,369,4);
 update=t=>{const p=smooth((t-.14)/.65),turn=smooth((t-.87)/.65);
   top.style.transform='translateY('+(-46*turn).toFixed(4)+'px) scale('+(1-.23*turn).toFixed(5)+')';
   show(top,p);
   ln.style.transform='scaleX('+smooth((t-.72)/.52).toFixed(5)+')';
   show(ln,smooth((t-.65)/.26));
   at(second,0,18*(1-turn));show(second,turn);
 };
}else if(id==='K13'){ // Large title folds to a small information label then unfolds.
 const big=item('還沒結束',272,192,121);
 const index=item('STILL MOVING',302,342,24,'soft',{letterSpacing:'.14em'});
 const ln=rule(293,380,390,2);
 update=t=>{const p=smooth((t-.6)/.53),q=smooth((t-1.46)/.55);
   const fold=p*(1-q);
   at(big,465*fold,-132*fold,1-.66*fold,0);
   show(big,smooth((t-.02)/.3));
   at(index,335*fold,-15*fold,1-.18*fold);
   show(index,smooth((t-.28)/.34)*(1-.65*fold));
   ln.style.transform='scaleX('+(1-.65*fold).toFixed(4)+')';show(ln,smooth((t-.27)/.3));
 };
}else if(id==='K19'){ // Event-directed triptych with different typography and timing.
 const g=[item('先等等',295,206,113),item('注意！',336,200,124,'soft'),item('現在開始',240,198,115)];
 const counter=item('01  —  02  —  03',369,351,23,'dim',{letterSpacing:'.04em'});
 update=t=>{const windows=[[.05,.7],[.73,1.37],[1.40,2.5]];
    g.forEach((e,i)=>{const [a,b]=windows[i],p=smooth((t-a)/.19),out=(i===2?0:smooth((t-b+.18)/.18));
      at(e,(1-p)*[-80,0,80][i],0,1+(1-p)*[-.12,.24,-.16][i]);
      show(e,p*(1-out));});
    show(counter,smooth((t-.45)/.3));
 };
}else{throw new Error('Unknown recipe '+id);}
window.renderAt=function(time){update(Math.max(0,Number(time)||0));};
window.renderAt(0);
</script></body></html>
