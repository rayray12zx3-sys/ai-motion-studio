<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=360, initial-scale=1"/>
<title>Original synthetic UI motion | engine benchmark</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0e1c29}
#main{position:relative;width:360px;height:640px;background:linear-gradient(155deg,#0d2030,#173746);overflow:hidden}
.card{position:absolute;top:240px;left:88px;width:184px;height:144px;background:#204755;border:2px solid #70d5b8;border-radius:24px;box-shadow:0 22px 54px #0006;
 animation:cardArrival 1s cubic-bezier(.2,.75,.3,1) both}
.bar{position:absolute;left:24px;top:32px;height:12px;width:120px;background:#a8eee0;border-radius:6px}
.bar.secondary{top:62px;width:78px;background:#e8c481}
.track{position:absolute;left:24px;top:105px;width:130px;height:8px;background:#41616b;border-radius:4px;overflow:hidden}
.fill{height:100%;background:#e4c381;animation:fillBar 1s linear both;transform-origin:left center}
@keyframes cardArrival{0%{transform:translateY(48px) scale(.94);opacity:0}30%{opacity:1}75%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes fillBar{0%{width:0}100%{width:110px}}
</style>
</head>
<body>
<div id="main" data-composition-id="original-synthetic-motion" data-no-timeline data-start="0" data-duration="1" data-width="360" data-height="640" data-fps="30">
  <section id="ui-card-scene" class="clip" data-start="0" data-duration="1" data-track-index="1">
    <div class="card" aria-label="Original synthetic graphics">
      <div class="bar"></div><div class="bar secondary"></div>
      <div class="track"><div class="fill"></div></div>
    </div>
  </section>
</div>
</body>
</html>
