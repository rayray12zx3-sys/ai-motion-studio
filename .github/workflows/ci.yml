name: CI

on:
  push:
    branches:
      - main
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_full_render:
        description: "Generate full-resolution synthetic MP4 review (uses runner minutes)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Preserve the established CI/offline-render check, but without video renders.
      - name: Source and deterministic-input checks
        run: npm run lint && npm run typecheck && npm test
      # One-time acceptance smoke for the M5 PNG-only preview, never full MP4.
      # Other PRs and future main checks stay at lint/typecheck/unit tests.
      - name: Verify 15 sampled PNG frames in both ratios (M5 acceptance)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 15 }}
        run: npm run test:preview

      # One review-only PNG render for M6. No FFmpeg, no 1080p or paid API.
      - name: M6 authored curtain PNG review
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 19 }}
        run: |
          npm run test:preview
          node scripts/preview-advanced.mjs landscape preview-m6-landscape
          node scripts/preview-advanced.mjs vertical preview-m6-vertical
      - name: M6 contact-sheet and frame samples
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 19 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m6-png-only-review
          path: |
            out/preview-m6-landscape/
            out/preview-m6-vertical/
          retention-days: 1
          if-no-files-found: error

      # A deliberate manual dispatch is the ONLY way to run the 1080p renders.
      - name: Provision hash-verified encoder
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_full_render }}
        run: node scripts/setup-encoder.mjs
      - name: Synthetic render smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_full_render }}
        run: npm run render:smoke && npm run render:vertical && npm run render:demo
      - name: Editorial motion review renders
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_full_render }}
        run: npm run render:editorial:landscape && npm run render:editorial:vertical
      - name: Advanced multi-shot review renders
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_full_render }}
        run: npm run render:advanced:landscape && npm run render:advanced:vertical
      - name: Synthetic review artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_full_render }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-motion-review
          path: out/
          retention-days: 7
          if-no-files-found: error
