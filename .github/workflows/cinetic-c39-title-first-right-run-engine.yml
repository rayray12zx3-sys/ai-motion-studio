name: Cinetic C3.9 synthetic page-stack real HyperFrames render

on:
  push:
    branches:
      - 'experiment/cinetic-director-adapter-*'
    paths:
      - 'experiments/cinetic-sidecar/title-first-right-run.mjs'
      - 'experiments/cinetic-sidecar/title-first-right-run.test.mjs'
      - '.github/workflows/cinetic-c39-page-stack-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinetic-c39-synthetic-page-stack
  cancel-in-progress: true

jobs:
  original-synthetic-page-stack-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Existing lockfile only, no postinstall scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate unique parent groups and deterministic reverse seek
        run: |
          node --check experiments/cinetic-sidecar/title-first-right-run.mjs
          node --test experiments/cinetic-sidecar/title-first-right-run.test.mjs
          node experiments/cinetic-sidecar/title-first-right-run.mjs out/cinetic-c39-stack
      - name: Setup existing verified ffmpeg/ffprobe pair
        run: |
          node scripts/setup-encoder.mjs
          echo "$(dirname "$(node -p "require('ffmpeg-static')")")" >> "$GITHUB_PATH"
          echo "$(dirname "$(node -p "require('ffprobe-static').path")")" >> "$GITHUB_PATH"
      - name: Verify exact isolated HyperFrames package
        run: |
          test "$(npm view hyperframes@0.8.143 dist.shasum)" = "8761025aa327993c605a307ec2d9f01fe6bde047"
      - name: Render page-stack on REAL HyperFrames CLI
        run: |
          cd out/cinetic-c39-stack
          npx --yes hyperframes@0.8.143 render -c index.html -o ./page-stack.mp4 --fps 30 --quality draft
      - name: Decoder check actual 95 frames and extract handoff evidence
        run: |
          set -euo pipefail
          cd out/cinetic-c39-stack
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=noprint_wrappers=1:nokey=1 page-stack.mp4)" = "95"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 page-stack.mp4)" = "720x1280"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 page-stack.mp4)" = "h264"
          ffmpeg -nostdin -hide_banner -loglevel error -i page-stack.mp4 -vf "select='eq(n,0)+eq(n,38)+eq(n,62)+eq(n,63)+eq(n,70)+eq(n,76)+eq(n,87)'" -vsync 0 evidence-%02d.png
          test "$(find . -maxdepth 1 -name 'evidence-*.png' | wc -l)" = "7"
          sha256sum page-stack.mp4 > page-stack.sha256
      - name: Technical only, no art or upstream Skill parity
        run: |
          echo 'C3.9 = actual HyperFrames@0.8.143 renderer; custom page-stack adapter; not complete upstream Cinetic Skill implementation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Company media: NONE. User art, typography, license, Windows Premiere: PENDING. No default renderer modification.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinetic-c39-real-hyperframes-original-synthetic-95f
          path: |
            out/cinetic-c39-stack/page-stack.mp4
            out/cinetic-c39-stack/page-stack.sha256
            out/cinetic-c39-stack/evidence-*.png
            out/cinetic-c39-stack/fixture.json
            out/cinetic-c39-stack/review-gates.json
          if-no-files-found: error
          retention-days: 2
