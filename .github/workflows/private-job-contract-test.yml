name: Private job contract unit tests (no data access)

on:
  push:
    branches:
      - experiment/helios-actions-synthetic-20261015
    paths:
      - 'experiments/helios-actions/private-job-contract.mjs'
      - 'experiments/helios-actions/private-job-contract.test.mjs'
      - 'experiments/helios-actions/private-drive-adapter.mjs'
      - 'experiments/helios-actions/private-drive-adapter.test.mjs'
      - 'experiments/helios-actions/private-k09-layout.mjs'
      - 'experiments/helios-actions/private-k09-layout.test.mjs'
      - '.github/workflows/private-job-contract-test.yml'
  pull_request:
    paths:
      - 'experiments/helios-actions/private-job-contract.mjs'
      - 'experiments/helios-actions/private-job-contract.test.mjs'
      - 'experiments/helios-actions/private-drive-adapter.mjs'
      - 'experiments/helios-actions/private-drive-adapter.test.mjs'
      - 'experiments/helios-actions/private-k09-layout.mjs'
      - 'experiments/helios-actions/private-k09-layout.test.mjs'
      - '.github/workflows/private-job-contract-test.yml'

permissions:
  contents: read

concurrency:
  group: helios-private-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Prove only UUID crosses public dispatch boundary
        run: node --test experiments/helios-actions/private-job-contract.test.mjs experiments/helios-actions/private-drive-adapter.test.mjs experiments/helios-actions/private-k09-layout.test.mjs
