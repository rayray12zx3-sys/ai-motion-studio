name: Creative direction research gate
on:
  pull_request:
    paths:
      - 'experiments/creative-direction/**'
      - '.github/workflows/creative-direction-rnd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-original-treatments:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Validate isolated director preflight
        run: |
          cd experiments/creative-direction
          node --check src/treatment.mjs
          node --check examples/two-original-briefs.mjs
          node --test tests/*.test.mjs
