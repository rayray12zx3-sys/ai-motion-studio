name: Local Konva editor Windows browser E2E

on:
  pull_request:
    paths:
      - 'editor/**'
      - 'tests/editor-local-app.test.mjs'
      - '.github/workflows/editor-windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-editor-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    env:
      MOTION_EDITOR_BROWSER_CHANNEL: ${{ matrix.browser }}
      MOTION_EDITOR_HEADED: '1'
      MOTION_EDITOR_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install only the pinned editor frontend
        working-directory: ${{ github.workspace }}/editor
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund
      - name: Verify Windows Konva package and ESM syntax
        shell: pwsh
        run: |
          node --check editor/server.mjs
          node --check editor/app.mjs
          node --check editor/operations.mjs
          node --check editor/verify.mjs
          node --input-type=module -e "import assert from 'node:assert/strict';import{readFileSync}from'node:fs';const p=JSON.parse(readFileSync('editor/node_modules/konva/package.json'));assert.equal(p.version,'10.7.1');assert.equal(p.license,'MIT');"
      - name: Local loopback, atomic save, ETag and S1 tests on Windows
        run: node --test tests/editor-local-app.test.mjs
      - name: Real installed Windows browser gestures, persistence and refusal
        working-directory: ${{ github.workspace }}/editor
        run: node verify.mjs
      - name: Synthetic screenshots, browser trace and machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: konva-editor-windows-${{ matrix.browser }}-synthetic
          path: |
            out/konva-editor-*.png
            out/konva-editor-approved-synthetic-report.json
            out/konva-editor-synthetic-trace.zip
          retention-days: 7
          if-no-files-found: error
      - name: Scope reminder
        shell: pwsh
        run: |
          "Windows Node 24 + real Chrome/Edge GUI automation with synthetic scenes; human acceptance on the operator PC, Windows Premiere and video-output approval remain unverified." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
