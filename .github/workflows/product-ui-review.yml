name: Synthetic Product UI 9x16 Visual Review

on:
  pull_request:
    paths:
      - 'src/creative/product-ui.mjs'
      - 'src/creative/product-ui-choreography.mjs'
      - 'src/creative/social-safe-area.mjs'
      - 'scripts/preview-product-ui.mjs'
      - 'scripts/preview-product-ui-choreography.mjs'
      - 'examples/product-ui-synthetic.json'
      - 'tests/product-ui.test.mjs'
      - 'tests/product-ui-choreography.test.mjs'
      - 'package.json'
      - '.github/workflows/product-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install pinned tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All source and alpha safe-zone tests
        run: npm run lint && npm run typecheck && npm test
      # GitHub checks out the pull_request merge ref, not just the old M11
      # branch HEAD. These assertions prevent a stale-green M11 status from
      # substituting for the latest M10->M11 combined-tree acceptance.
      - name: Confirm live M10-base and M11-head merge checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" -eq 2
          test "$1" = "$EXPECTED_BASE"
          test "$2" = "$EXPECTED_HEAD"
          echo "Verified stacked merge checkout: base=$EXPECTED_BASE head=$EXPECTED_HEAD"
      - name: Verify newest M10 Core and isolated lock on combined tree
        run: |
          test -f experiments/theatre/package-lock.json
          test -f experiments/theatre/tests/browser-roundtrip.mjs
          npm ci --prefix experiments/theatre --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- experiments/theatre/package-lock.json
          npm test --prefix experiments/theatre
          npm run bundle --prefix experiments/theatre
      - name: Validate actual M10 native Studio drag in M11 merged test tree
        run: node experiments/theatre/tests/browser-roundtrip.mjs
      - name: Verify approved encoder
        run: node scripts/setup-encoder.mjs
      - name: Render 9x16 synthetic UI previews
        run: npm run preview:product-ui:synthetic
      - name: Render connected UI choreography 4-second video
        run: npm run preview:product-ui:choreography
      - name: Upload 3 review MP4s and safe-zone contact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-ui-synthetic-9x16-visual-review
          path: |
            out/product-ui-concept-review/
            out/product-ui-choreography-review/
          retention-days: 1
          if-no-files-found: error
