name: Cinetic C3.4 scene-bound typography art gate

on:
  push:
    branches:
      - 'experiment/cinetic-director-adapter-*'
    paths:
      - 'experiments/cinetic-sidecar/styleframe-c34.py'
      - 'experiments/cinetic-sidecar/styleframe-c34.test.py'
      - '.github/workflows/cinetic-c34-styleframes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinetic-c34-branch
  cancel-in-progress: true

jobs:
  source-editable-public-synthetic-stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Install temp preview-only rasterizer and visible CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check --no-cache-dir 'CairoSVG==2.8.2' 'Pillow==11.3.0'
          fc-match -f '%{family}\n' 'Noto Sans CJK TC' | grep -F 'Noto Sans CJK TC'
      - name: Validate the anti-PPT source and reject implicit approvals
        run: |
          python experiments/cinetic-sidecar/styleframe-c34.test.py
          python experiments/cinetic-sidecar/styleframe-c33.test.py
      - name: Generate original full-bleed scene-bound SVG styleframes
        run: python experiments/cinetic-sidecar/styleframe-c34.py out/cinetic-c34
      - name: Render actual PNGs, 3-wide review and phone scale review, measure real pixels
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import cairosvg
          from PIL import Image,ImageStat,ImageOps
          directory=Path("out/cinetic-c34")
          triptych=Image.new("RGB",(1920,360),"#0c1d29")
          device=Image.new("RGB",(960,180),"#0c1d29")
          entries=[]
          for i in range(1,4):
              stem="styleframe-%02d"%i
              src=directory/(stem+".svg")
              dest=directory/(stem+".png")
              cairosvg.svg2png(url=str(src),write_to=str(dest),output_width=1280,output_height=720)
              image=Image.open(dest).convert("RGB")
              assert image.size==(1280,720)
              extrema=image.getextrema()
              assert min(hi-lo for lo,hi in extrema)>50,"scene pixel channel unexpectedly flat"
              std=ImageStat.Stat(image).stddev
              assert min(std)>23,"insufficient tonal color separation"
              triptych.paste(ImageOps.contain(image,(640,360)),((i-1)*640,0))
              device.paste(ImageOps.contain(image,(320,180)),((i-1)*320,0))
              entries.append({"id":stem,"sha256_svg":hashlib.sha256(src.read_bytes()).hexdigest(),
                "sha256_png":hashlib.sha256(dest.read_bytes()).hexdigest(),
                "size":[1280,720],"rgb_stddev":[round(z,2) for z in std]})
          assert len(set(x["sha256_png"] for x in entries))==3
          triptych.save(directory/"styleframe-triptych.png")
          device.save(directory/"styleframe-device-check.png")
          (directory/"preview-qa.json").write_text(json.dumps({
             "technical":"REAL_3_PNG_PREVIEW_PASS",
             "art":"PENDING_INDEPENDENT_VISUAL_AND_USER_REVIEW",
             "mobile_png":"320x180 scale comparative only; readability NOT_AUTO_CERTIFIED",
             "no_animation_rendered":True,"windowsPremiere":"NOT_TESTED",
             "commercialRights":"NOT_CLEARED","frames":entries},indent=2)+"\n")
          print("C34_THREE_ORIGINAL_STILLS_RENDERED",len(entries))
          PY
      - name: Save actual PNG+editable SVG+QA only; no preview-font binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinetic-c34-scene-driven-three-styleframes
          path: |
            out/cinetic-c34/styleframe-*.svg
            out/cinetic-c34/styleframe-*.png
            out/cinetic-c34/styleframes-manifest.json
            out/cinetic-c34/preview-qa.json
          retention-days: 7
          if-no-files-found: error
      - name: Keep exact human creative stop and unmodified production default
        run: |
          echo 'C3.4: three original stills only. Green CI cannot approve art or imply a complete film.' >> "$GITHUB_STEP_SUMMARY"
          echo 'User style acceptance required before producing even the narrow 2-3-second motion experiment.' >> "$GITHUB_STEP_SUMMARY"
