name: GSAP coded motion R&D unit gates
on:
  pull_request:
    paths:
      - 'experiments/gsap-coded-motion/**'
      - '.github/workflows/gsap-coded-motion-rnd.yml'
  workflow_dispatch:
jobs:
  motion-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/gsap-coded-motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated pinned GSAP and Three.js dependencies only
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Scene graph, coded GSAP, real Three.js math and shader-compositor contract
        run: npm run check
      - name: Real Chromium WebGL2 shader compilation, full-frame pixel and seek check
        run: node scripts/browser-gpu-smoke.mjs
      - name: Render contiguous 300-frame genuine GPU H264 review-only film
        run: node scripts/render-gpu-film.mjs
      - name: Save isolated GPU evidence (not a creative acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-three-rnd-gpu-evidence
          path: experiments/gsap-coded-motion/out/three-*
          if-no-files-found: ignore
          retention-days: 3
