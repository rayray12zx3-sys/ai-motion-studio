name: GSAP coded motion R&D unit gates
on:
  pull_request:
    paths:
      - 'experiments/gsap-coded-motion/**'
      - '.github/workflows/gsap-coded-motion-rnd.yml'
  workflow_dispatch:
jobs:
  motion-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: experiments/gsap-coded-motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated pinned GSAP and Three.js dependencies only
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Scene graph, coded GSAP, real Three.js math and shader-compositor contract
        run: npm run check
