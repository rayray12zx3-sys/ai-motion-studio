name: Isolated Synthetic Motion QA Research

on:
  pull_request:
    paths:
      - 'experiments/motion-qa/**'
      - '.github/workflows/motion-qa-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Syntax check original RGBA metrics
        run: node --check experiments/motion-qa/frame-metrics.mjs
      - name: Install existing pinned Canvas dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check original synthetic benchmark syntax
        run: |
          node --check experiments/motion-qa/render-benchmark.mjs
          node --check experiments/motion-qa/run-benchmark.mjs
          node --check experiments/motion-qa/render-second-benchmark.mjs
          node --check experiments/motion-qa/run-second-benchmark.mjs
          node --check experiments/motion-qa/export-second-preview.mjs
      - name: Execute both unit and real Canvas-frame acceptance tests
        run: node --test experiments/motion-qa/tests/*.test.mjs
      - name: Render 400 original synthetic Canvas frames and verify QA findings
        run: node experiments/motion-qa/run-benchmark.mjs
      - name: Render second original 540-frame scene-cut and hold benchmark
        run: node experiments/motion-qa/run-second-benchmark.mjs
      - name: Provision existing hash-verified FFmpeg for synthetic review clip
        run: node scripts/setup-encoder.mjs
      - name: Encode and verify second original 3-second preview
        run: node experiments/motion-qa/export-second-preview.mjs
      - name: Save playable second-original synthetic review clip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-qa-second-original-preview
          path: |
            out/motion-qa-synthetic-benchmark/second-original-preview-540x960.mp4
            out/motion-qa-synthetic-benchmark/second-original-preview-info.json
          retention-days: 2
          if-no-files-found: error
      - name: Save sanitized synthetic QA report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-qa-synthetic-report
          path: |
            out/motion-qa-synthetic-benchmark/benchmark.json
            out/motion-qa-synthetic-benchmark/secondary-benchmark.json
          retention-days: 2
          if-no-files-found: error
      - name: Record R&D-only scope
        run: |
          echo '940 original synthetic Canvas frames checked across 11 cases (including declared cuts/holds). NO company media or raw frames saved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Technical motion diagnosis only: NOT production-ready or artist-approved.' >> "$GITHUB_STEP_SUMMARY"
