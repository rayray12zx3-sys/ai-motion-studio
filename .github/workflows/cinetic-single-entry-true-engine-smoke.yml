name: Cinetic single-entry true HyperFrames 2s public synthetic smoke
on:
  push:
    branches: ['work/cinetic-single-entry-mvp-20261026']
    paths:
      - '.github/workflows/cinetic-single-entry-true-engine-smoke.yml'
permissions:
  contents: read
concurrency:
  group: cinetic-single-entry-true-engine-public-synthetic
  cancel-in-progress: true
jobs:
  genuine-engine-public-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install only pre-existing locked project dependencies without postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provision repository-pinned FFmpeg and FFprobe for tests and real render
        run: |
          node scripts/setup-encoder.mjs
          echo "$(dirname "$(node -p "require('ffmpeg-static')")")" >> "$GITHUB_PATH"
          echo "$(dirname "$(node -p "require('ffprobe-static').path")")" >> "$GITHUB_PATH"
      - name: Regression test single-entry routing and real-media audit
        run: |
          node --test experiments/cinetic-sidecar/cinetic-flow.test.mjs experiments/cinetic-sidecar/cinetic-diagnostics.test.mjs experiments/cinetic-sidecar/cinetic-integration.test.mjs experiments/cinetic-sidecar/cinetic-techniques.test.mjs
          node --test experiments/cinetic-sidecar/adapter.test.mjs
      - name: Exercise authentic upstream 273-technique director picker, no rendered art approval
        shell: bash
        run: |
          python3 experiments/cinetic-sidecar/upstream-cinetic/scripts/pick.py --validate
          node experiments/cinetic-sidecar/cinetic-flow.mjs pick experiments/cinetic-sidecar/story-eight.plan.json out/cinetic-upstream-directed --energy calm --seed 123
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync('out/cinetic-upstream-directed/director-selection.json'));if(x.catalogCount!==273||!x.selectedPicks.length||x.gates.render!=='NOT_RUN'||x.gates.release!=='BLOCKED')throw Error('invalid source-pinned upstream Cinetic selection');"
      - name: Validate official HyperFrames v0.8.143 npm tarball version fingerprint
        run: |
          actual="$(npm view hyperframes@0.8.143 dist.shasum)"
          test "$actual" = "8761025aa327993c605a307ec2d9f01fe6bde047"
      - name: Install isolated pinned runtime, never global or private
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cinetic-hf-pinned"
          npm install --prefix "$RUNNER_TEMP/cinetic-hf-pinned" --ignore-scripts --no-audit --no-fund --no-save --package-lock=false hyperframes@0.8.143
          test "$(node -p "require('$RUNNER_TEMP/cinetic-hf-pinned/node_modules/hyperframes/package.json').version")" = "0.8.143"
          entry="$(readlink -f "$RUNNER_TEMP/cinetic-hf-pinned/node_modules/.bin/hyperframes")"
          test -f "$entry"
          echo "HF_ENTRY=$entry" >> "$GITHUB_ENV"
          echo "HF_SHA=$(sha256sum "$entry" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Use single entrypoint to verify host before rendering
        shell: bash
        run: |
          node experiments/cinetic-sidecar/cinetic-flow.mjs doctor "$HF_ENTRY" "$HF_SHA" > "$RUNNER_TEMP/cinetic-doctor.json"
          node -e "const f=require('fs'),r=JSON.parse(f.readFileSync(process.argv[1]));if(r.status!=='READY_TO_ATTEMPT_NOT_RENDERED')throw Error(JSON.stringify(r.issues))" "$RUNNER_TEMP/cinetic-doctor.json"
      - name: Render genuine pinned HyperFrames MP4 and transparent ProRes4444, then verify
        shell: bash
        run: |
          node experiments/cinetic-sidecar/cinetic-flow.mjs experiments/cinetic-sidecar/probe.plan.json out/cinetic-single-entry-real --render --hf "$HF_ENTRY" --hf-sha "$HF_SHA"
          node -e "const f=require('fs'),r=JSON.parse(f.readFileSync('out/cinetic-single-entry-real/technical-report.json'));if(r.status!=='SYNTHETIC_RENDER_TECHNICAL_QA_PASS_NOT_ART_APPROVAL')throw Error('Actual MP4+alpha tech QA failed')"
          node -e "const f=require('fs'),r=JSON.parse(f.readFileSync('out/cinetic-single-entry-real/flow-receipt.json'));if(r.gates.release!=='BLOCKED'||!r.outputs.mp4||!r.outputs.mov)throw Error('Invalid boundary receipt')"
      - name: Verify longer 8s same-entry narrative and independent 9-by-16 portrait run
        shell: bash
        run: |
          node experiments/cinetic-sidecar/cinetic-flow.mjs experiments/cinetic-sidecar/story-eight.plan.json out/cinetic-single-entry-story8-real --render --hf "$HF_ENTRY" --hf-sha "$HF_SHA"
          node experiments/cinetic-sidecar/cinetic-flow.mjs experiments/cinetic-sidecar/portrait.plan.json out/cinetic-single-entry-portrait-real --render --hf "$HF_ENTRY" --hf-sha "$HF_SHA"
          node -e "const f=require('fs');for(const p of ['out/cinetic-single-entry-story8-real','out/cinetic-single-entry-portrait-real']){const x=JSON.parse(f.readFileSync(p+'/technical-report.json'));if(x.status!=='SYNTHETIC_RENDER_TECHNICAL_QA_PASS_NOT_ART_APPROVAL')throw Error('true output failed '+p);const g=JSON.parse(f.readFileSync(p+'/flow-receipt.json'));if(g.gates.userArt!=='PENDING'||g.gates.release!=='BLOCKED')throw Error('invalid approval '+p)}"
      - name: Validate true 60fps same entrypoint and ProRes4444 alpha (public original only)
        shell: bash
        run: |
          node experiments/cinetic-sidecar/cinetic-flow.mjs experiments/cinetic-sidecar/storyboard-film-60fps-smoke.plan.json out/cinetic-single-entry-60fps-real --render --hf "$HF_ENTRY" --hf-sha "$HF_SHA"
          node -e "const f=require('fs'),r=JSON.parse(f.readFileSync('out/cinetic-single-entry-60fps-real/technical-report.json'));if(r.render.fps!==60||r.render.frames!==480||r.status!=='SYNTHETIC_RENDER_TECHNICAL_QA_PASS_NOT_ART_APPROVAL')throw Error('60fps full real render not valid')"
      - name: Upload public-original outputs, exclude all font binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinetic-single-entry-real-hf-c2-public-original
          retention-days: 1
          if-no-files-found: error
          path: |
            out/cinetic-single-entry-real/preview.mp4
            out/cinetic-single-entry-real/overlay-alpha.mov
            out/cinetic-single-entry-real/technical-report.json
            out/cinetic-single-entry-real/flow-receipt.json
            out/cinetic-single-entry-real/validated-plan.json
            out/cinetic-single-entry-real/review-gates.json
            out/cinetic-single-entry-real/font-qa.json
            out/cinetic-single-entry-story8-real/preview.mp4
            out/cinetic-single-entry-story8-real/overlay-alpha.mov
            out/cinetic-single-entry-story8-real/technical-report.json
            out/cinetic-single-entry-story8-real/flow-receipt.json
            out/cinetic-single-entry-story8-real/validated-plan.json
            out/cinetic-single-entry-story8-real/review-gates.json
            out/cinetic-single-entry-portrait-real/preview.mp4
            out/cinetic-single-entry-portrait-real/overlay-alpha.mov
            out/cinetic-single-entry-portrait-real/technical-report.json
            out/cinetic-single-entry-portrait-real/flow-receipt.json
            out/cinetic-single-entry-portrait-real/validated-plan.json
            out/cinetic-single-entry-portrait-real/review-gates.json
            out/cinetic-single-entry-60fps-real/preview.mp4
            out/cinetic-single-entry-60fps-real/overlay-alpha.mov
            out/cinetic-single-entry-60fps-real/technical-report.json
            out/cinetic-single-entry-60fps-real/flow-receipt.json
            out/cinetic-single-entry-60fps-real/validated-plan.json
            out/cinetic-single-entry-60fps-real/review-gates.json
            out/cinetic-upstream-directed/director-selection.json
            out/cinetic-upstream-directed/upstream-picked.json
      - name: Record boundaries
        run: |
          echo 'True engine C2 public synthetic smoke ONLY. No company media, no upstream 273 technique implementation, no art approval or Windows Premiere proof.' >> "$GITHUB_STEP_SUMMARY"
