name: Cinetic C3.1 editorial redesign

on:
  push:
    branches:
      - 'experiment/cinetic-director-adapter-*'
    paths:
      - 'experiments/cinetic-sidecar/signal-ledger.mjs'
      - 'experiments/cinetic-sidecar/signal-ledger.test.mjs'
      - 'experiments/cinetic-sidecar/story-eight-editorial.plan.json'
      - 'experiments/cinetic-sidecar/adapter.mjs'
      - 'experiments/cinetic-sidecar/prepare-render.mjs'
      - 'experiments/cinetic-sidecar/verify-render.mjs'
      - 'experiments/cinetic-sidecar/audit-upstream.mjs'
      - '.github/workflows/cinetic-c31-editorial-rnd.yml'

permissions:
  contents: read

concurrency:
  group: cinetic-editorial-rnd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-editorial-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout read-only pinned upstream Cinetic source into ignored directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Leonxlnx/cinetic
          ref: ecfa6605de1adb9345ce937724810dc32267d068
          path: out/cinetic-editorial-upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Use original locked packages and reject unreviewed scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact original brief, optical hierarchy and framewise motion
        run: |
          node --test experiments/cinetic-sidecar/adapter.test.mjs experiments/cinetic-sidecar/semantic-graph.test.mjs experiments/cinetic-sidecar/evidence-cards.test.mjs experiments/cinetic-sidecar/signal-ledger.test.mjs
          node --check experiments/cinetic-sidecar/signal-ledger.mjs
          node experiments/cinetic-sidecar/prepare-render.mjs experiments/cinetic-sidecar/story-eight-editorial.plan.json out/cinetic-editorial
          node experiments/cinetic-sidecar/audit-upstream.mjs out/cinetic-editorial-upstream out/cinetic-editorial/upstream-provenance.json experiments/cinetic-sidecar/story-eight-editorial.plan.json
      - name: Verify pinned encoder and probe
        run: |
          node scripts/setup-encoder.mjs
          echo "$(dirname "$(node -p "require('ffmpeg-static')")")" >> "$GITHUB_PATH"
          echo "$(dirname "$(node -p "require('ffprobe-static').path")")" >> "$GITHUB_PATH"
      - name: Verify HyperFrames 0.8.143 public tarball pin
        run: |
          test "$(npm view hyperframes@0.8.143 dist.shasum)" = "8761025aa327993c605a307ec2d9f01fe6bde047"
      - name: Render 8-second redesigned 16:9 MP4 preview
        run: |
          cd out/cinetic-editorial
          npx --yes hyperframes@0.8.143 render -c index.html -o preview.mp4 --fps 30 --quality draft
      - name: Render exact same revised art in ProRes4444 with real alpha
        run: |
          cd out/cinetic-editorial
          npx --yes hyperframes@0.8.143 render -c index-alpha.html -o overlay-alpha.mov --format mov --fps 30
      - name: Decode and assert real frames, independent review and safe alpha margins
        run: node experiments/cinetic-sidecar/verify-render.mjs out/cinetic-editorial
      - name: Create review GIF from actual encoded video
        run: |
          ffmpeg -nostdin -y -v error -i out/cinetic-editorial/preview.mp4 \
            -filter_complex '[0:v]fps=10,scale=640:-2:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer' \
            -loop 0 out/cinetic-editorial/review-only.gif
          test -s out/cinetic-editorial/review-only.gif
      - name: Archive independent synthetic R&D evidence, exclude font binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinetic-c31-editorial-original-synthetic
          path: |
            out/cinetic-editorial/preview.mp4
            out/cinetic-editorial/overlay-alpha.mov
            out/cinetic-editorial/review-only.gif
            out/cinetic-editorial/technical-report.json
            out/cinetic-editorial/font-qa.json
            out/cinetic-editorial/review-gates.json
            out/cinetic-editorial/validated-plan.json
            out/cinetic-editorial/timeline.json
            out/cinetic-editorial/upstream-provenance.json
          retention-days: 2
          if-no-files-found: error
      - name: Preserve hard approval stops
        run: |
          echo 'C3.1 is only isolated synthetic editorial prototype, not automatically approved art or production use.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Visual review must independently inspect actual full-speed GIF/MP4; upstream full skill, commercial rights, native Windows Premiere remain unverified.' >> "$GITHUB_STEP_SUMMARY"
