name: P2 semantic product scenes R&D
on:
  pull_request:
    paths:
      - 'experiments/p2-semantic-scenes/**'
      - '.github/workflows/p2-semantic-scenes-rnd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Check compiler and both independent briefs
        run: |
          node --check experiments/p2-semantic-scenes/src/semantic-scenes.mjs
          node --check experiments/p2-semantic-scenes/scripts/emit-svg-frames.mjs
          node --check experiments/p2-semantic-scenes/scripts/score-cues.mjs
          node --check experiments/p2-semantic-scenes/scripts/load-director-brief.mjs
          node --check experiments/p2-semantic-scenes/examples/two-original-briefs.mjs
          node --test experiments/p2-semantic-scenes/tests/*.test.mjs
          python3 -m py_compile experiments/p2-semantic-scenes/scripts/render_video.py
          python3 -m py_compile experiments/p2-semantic-scenes/scripts/score_soundtrack.py
          python3 -m py_compile experiments/p2-semantic-scenes/scripts/av_audit.py
          python3 -m unittest discover -s experiments/p2-semantic-scenes/tests -p 'test_*.py'
      - name: Emit deterministic sampled SVGs and causal manifests
        run: |
          node experiments/p2-semantic-scenes/scripts/emit-svg-frames.mjs board
          node experiments/p2-semantic-scenes/scripts/emit-svg-frames.mjs caption
          node experiments/p2-semantic-scenes/scripts/score-cues.mjs board
          node experiments/p2-semantic-scenes/scripts/score-cues.mjs caption
          # Public original synthetic fixture only: prove JSON input without new per-brief JS.
          node --input-type=module -e "import {boardBrief} from './experiments/p2-semantic-scenes/examples/two-original-briefs.mjs'; import {writeFileSync} from 'node:fs'; writeFileSync('experiments/p2-semantic-scenes/artifacts/creative-director-original.json',JSON.stringify(boardBrief))"
          node experiments/p2-semantic-scenes/scripts/score-cues.mjs --spec experiments/p2-semantic-scenes/artifacts/creative-director-original.json
          node experiments/p2-semantic-scenes/scripts/emit-svg-frames.mjs --spec experiments/p2-semantic-scenes/artifacts/creative-director-original.json
          test -f experiments/p2-semantic-scenes/artifacts/atlas-board-to-date/samples/0165.svg
          test -f experiments/p2-semantic-scenes/artifacts/index-audio-to-caption/samples/0168.svg
      - name: Actually encode two FULL 360-frame silent H264 films and inspect every frame (NOT art QA)
        run: |
          python3 -m venv /tmp/p2-svg-venv
          . /tmp/p2-svg-venv/bin/activate
          python -m pip --disable-pip-version-check install CairoSVG==2.7.1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          # Same full 360-frame Atlas film is now rendered from plain JSON, with no scene JS added.
          python experiments/p2-semantic-scenes/scripts/render_video.py --spec experiments/p2-semantic-scenes/artifacts/creative-director-original.json
          python experiments/p2-semantic-scenes/scripts/render_video.py caption
          python experiments/p2-semantic-scenes/scripts/av_audit.py experiments/p2-semantic-scenes/artifacts/atlas-board-to-date/silent_review.mp4 --expected-frames 360 --cues experiments/p2-semantic-scenes/artifacts/atlas-board-to-date/score-cues.json --output experiments/p2-semantic-scenes/artifacts/atlas-board-to-date/silent_review-av-audit.json
          python experiments/p2-semantic-scenes/scripts/av_audit.py experiments/p2-semantic-scenes/artifacts/index-audio-to-caption/silent_review.mp4 --expected-frames 360 --cues experiments/p2-semantic-scenes/artifacts/index-audio-to-caption/score-cues.json --output experiments/p2-semantic-scenes/artifacts/index-audio-to-caption/silent_review-av-audit.json
          test -f experiments/p2-semantic-scenes/artifacts/atlas-board-to-date/silent_review-qc.json
          test -f experiments/p2-semantic-scenes/artifacts/index-audio-to-caption/silent_review-qc.json
      - name: Actually render a synthetic no-AE private-media compositing smoke (never upload its output)
        run: |
          # These are tiny GENERATED LAVFI test assets, not any user's purchased media.
          mkdir -p experiments/p2-semantic-scenes/artifacts/private
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=1080x1920:r=30:d=1' -frames:v 30 -c:v libx264 -threads 2 -preset ultrafast -pix_fmt yuv420p experiments/p2-semantic-scenes/artifacts/private/synthetic-base.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=640x360:rate=30:duration=1' -frames:v 30 -c:v libx264 -threads 2 -preset ultrafast -pix_fmt yuv420p /tmp/p2-original-synthetic-effect.mp4
          python3 experiments/p2-semantic-scenes/scripts/private_media_overlay.py --base experiments/p2-semantic-scenes/artifacts/private/synthetic-base.mp4 --asset /tmp/p2-original-synthetic-effect.mp4 --output experiments/p2-semantic-scenes/artifacts/private/synthetic-composite.mp4 --start-frame 5 --end-frame 25 --mode screen --opacity 0.45 --private-preview-only
          test -f experiments/p2-semantic-scenes/artifacts/private/synthetic-composite.private-qc.json
          # Also decode a genuinely RGBA PNG and encode the independent alpha path.
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=red@0.5:s=160x90:r=1:d=1,format=rgba' -frames:v 1 -update 1 experiments/p2-semantic-scenes/artifacts/private/synthetic-alpha.png
          python3 experiments/p2-semantic-scenes/scripts/private_media_overlay.py --base experiments/p2-semantic-scenes/artifacts/private/synthetic-base.mp4 --asset experiments/p2-semantic-scenes/artifacts/private/synthetic-alpha.png --output experiments/p2-semantic-scenes/artifacts/private/synthetic-alpha-composite.mp4 --start-frame 5 --end-frame 25 --mode alpha --opacity 0.5 --private-preview-only
          test -f experiments/p2-semantic-scenes/artifacts/private/synthetic-alpha-composite.private-qc.json
          # Real ProRes-with-alpha decoding, generated from lavfi (not licensed/proprietary footage).
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=red@0.5:s=192x192:r=30:d=0.5,format=rgba' -frames:v 15 -c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le -threads 2 /tmp/p2-synthetic-alpha.mov
          python3 experiments/p2-semantic-scenes/scripts/private_media_overlay.py --base experiments/p2-semantic-scenes/artifacts/private/synthetic-base.mp4 --asset /tmp/p2-synthetic-alpha.mov --output experiments/p2-semantic-scenes/artifacts/private/synthetic-alpha-mov-composite.mp4 --start-frame 5 --end-frame 19 --mode alpha --opacity 0.5 --private-preview-only
          test -f experiments/p2-semantic-scenes/artifacts/private/synthetic-alpha-mov-composite.private-qc.json
          # Privacy check: upload-artifact stanza below explicitly excludes all /private/ paths.
      - name: Real decode/encode test of independent authored animation formats (generated fixtures only)
        run: |
          mkdir -p /tmp/p2-icons
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=96x96:rate=15:duration=0.8' -frames:v 12 /tmp/p2-icons/generated.gif
          python3 experiments/p2-semantic-scenes/scripts/private_authored_icon_convert.py --source /tmp/p2-icons/generated.gif --kind gif --output experiments/p2-semantic-scenes/artifacts/private/synthetic-icon-gif.mov --authored-animation-reviewed --private-preview-only
          mkdir -p /tmp/p2-icons/seq
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=96x96:rate=30:duration=0.4' -frames:v 12 /tmp/p2-icons/seq/icon_%05d.png
          python3 experiments/p2-semantic-scenes/scripts/private_authored_icon_convert.py --source /tmp/p2-icons/seq --kind png-sequence --output experiments/p2-semantic-scenes/artifacts/private/synthetic-icon-png.mov --authored-animation-reviewed --private-preview-only
          test -f experiments/p2-semantic-scenes/artifacts/private/synthetic-icon-gif.private-qc.json
          test -f experiments/p2-semantic-scenes/artifacts/private/synthetic-icon-png.private-qc.json
          # All created effects are isolated under ignored private/; no upload.
      - name: Publish synthetic engineering evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-semantic-two-full-silent-engineering-films
          path: |
            experiments/p2-semantic-scenes/artifacts/*/silent_review.mp4
            experiments/p2-semantic-scenes/artifacts/*/silent_review-qc.json
            experiments/p2-semantic-scenes/artifacts/*/silent_review-av-audit.json
            experiments/p2-semantic-scenes/artifacts/*/score-cues.json
            experiments/p2-semantic-scenes/artifacts/*/samples/manifest.json
          retention-days: 2
          if-no-files-found: error
