name: M10 Synthetic ProRes 4444 Alpha Export

on:
  pull_request:
    paths:
      - 'experiments/theatre/scripts/export-alpha-smoke.mjs'
      - '.github/workflows/m10-alpha-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m10-alpha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            experiments/theatre/package-lock.json
      - name: Install pinned Canvas and FFmpeg dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated Theatre Core from committed lock
        run: npm ci --prefix experiments/theatre --ignore-scripts --no-audit --no-fund
      - name: Provision approved hash-verified encoder
        run: node scripts/setup-encoder.mjs
      - name: Encode actual synthetic ProRes 4444 alpha and decode frames
        run: node experiments/theatre/scripts/export-alpha-smoke.mjs
      - name: Save synthetic Alpha MOV, opaque MP4 preview and QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m10-synthetic-alpha-mov-preview
          path: experiments/theatre/out/alpha-smoke/
          retention-days: 2
          if-no-files-found: warn
